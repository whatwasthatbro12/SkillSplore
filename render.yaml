# Render Blueprint — provisions the SkillSplore web service and its Postgres
# database together. In the Render dashboard: New -> Blueprint -> point at
# this repo. See docs/DEPLOYMENT.md for the full walkthrough.
#
# This is a demo-mode deployment (APP_ENV=demo): seeded fictional data,
# demo login shortcuts enabled, safe to share publicly. For a real
# production deployment, change APP_ENV to "production" and remove the
# demo-only env vars below — see docs/DEPLOYMENT.md.

databases:
  - name: skillsplore-db
    plan: free
    databaseName: skillsplore
    user: skillsplore

services:
  - type: web
    name: skillsplore
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Free tier doesn't support preDeployCommand -- migrations and a
    # first-boot-only demo seed run inside the container's own entrypoint
    # instead (see apps/api/prisma/bootstrap.mjs / Dockerfile).
    #
    # STORAGE_DRIVER=local below writes uploads (avatars, qualification
    # documents) to the container's own filesystem, which Render's free
    # tier does NOT persist across redeploys or restarts -- real uploads
    # WILL be lost. Fixing this needs an infra decision only the account
    # owner can make (this can't be fixed from render.yaml alone):
    #   Option A: upgrade this service to a paid plan and attach a disk,
    #     then uncomment the block below.
    #   Option B: use an S3-compatible object storage provider (the code
    #     already supports this -- storage.ts, STORAGE_DRIVER=s3) and set
    #     S3_ENDPOINT / S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY as
    #     secret env vars in the Render dashboard (not committed here).
    # See docs/DEPLOYMENT.md for the full walkthrough of both options.
    # disk:
    #   name: uploads
    #   mountPath: /app/storage-data
    #   sizeGB: 1
    envVars:
      - key: APP_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: skillsplore-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: API_PORT
        value: 4000
      # The origin users actually visit. Drives CORS and the links in
      # verification and password-reset emails -- while this pointed at
      # RENDER_EXTERNAL_URL, those emails sent people to onrender.com.
      - key: WEB_ORIGIN
        value: https://skillsplore.org
      - key: VITE_API_URL
        fromService:
          type: web
          name: skillsplore
          envVarKey: RENDER_EXTERNAL_URL
      # Canonical public URL, used for <link rel="canonical">, Open Graph tags
      # and every entry in sitemap.xml.
      #
      # Hard-coded to the custom domain, NOT RENDER_EXTERNAL_URL, which stays
      # ".onrender.com" forever even after a domain is attached. While this
      # tracked RENDER_EXTERNAL_URL, every page served from skillsplore.org
      # carried <link rel="canonical" href="https://skillsplore.onrender.com/">
      # and all 549 sitemap URLs pointed at the Render host -- which tells
      # Google the real domain is a duplicate and to index the other one
      # instead. That is why the site was not discoverable under its own name.
      - key: PUBLIC_SITE_URL
        value: https://skillsplore.org
      # Comma-separated addresses granted ADMIN on boot. The account must
      # already exist -- register on the site first, then redeploy. Nothing
      # here creates an account or revokes anyone.
      - key: ADMIN_EMAILS
        value: admin@skillsplore.org
      # Deliberately NOT set here. Deleting the demo accounts is a one-off,
      # irreversible action against live data, so it belongs in the dashboard
      # where a person chooses it -- not in a file where a redeploy performs
      # it. Set REMOVE_DEMO_DATA=1 there when ready; it is safe to leave set
      # afterwards, and safe to remove.
      - key: FORCE_SECURE_COOKIES
        value: 1
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /app/storage-data
      # Demo trappings off: no banner, no one-click role login. The site now
      # looks and behaves like a real deployment.
      #
      # APP_ENV stays "demo" for one reason only: production refuses to boot
      # without a real SMTP host (see config/env.ts). Flipping it before email
      # is configured would take the site OFFLINE, not harden it. Change it in
      # the same commit that sets SMTP_HOST/SMTP_USER/SMTP_PASS.
      - key: SHOW_DEMO_BANNER
        value: 0
      - key: ENABLE_DEMO_LOGIN
        value: 0
      # .local is not a real TLD and every mail provider rejects it. Correct
      # now regardless of when a provider is chosen.
      - key: MAIL_FROM
        value: "SkillSplore <no-reply@skillsplore.org>"
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
